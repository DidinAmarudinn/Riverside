# Deploys the API (Cloud Run) and web (Firebase Hosting) on every push to main.
# Auth is keyless via Workload Identity Federation; set up once with infra/github-wif.sh.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, api, web]
        default: all

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: riverside-511503
  GCP_LOCATION: us-central1
  # Submission deadline (Mon 19 Oct 01:29 WIB). After it, pushes to main no longer deploy, so the
  # live revision stays as submitted; a manual run from the Actions tab still works for emergencies.
  DEPLOY_CUTOFF: "2026-10-18T18:29:00Z"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$(date -u +%s)" -ge "$(date -u -d "$DEPLOY_CUTOFF" +%s)" ]; then
            echo "::notice::Past $DEPLOY_CUTOFF, skipping auto-deploy. Use Run workflow to deploy by hand."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/770198971909/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: dr-deployer@riverside-511503.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        run: infra/deploy.sh "${{ inputs.target || 'all' }}"

      - name: Smoke check
        run: curl -fsS https://riverside-511503.web.app/api/healthz
